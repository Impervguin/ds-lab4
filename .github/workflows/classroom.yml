name: GitHub Classroom Workflow
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  gateway-tests:
    uses: ./.github/workflows/test-gateway.yml

  library-tests:
    uses: ./.github/workflows/test-library.yml

  rating-tests:
    uses: ./.github/workflows/test-rating.yml

  reservation-tests:
    uses: ./.github/workflows/test-reservation.yml

  build:
    name: Autograding
    runs-on: ubuntu-latest
    needs: [gateway-tests, library-tests, rating-tests, reservation-tests]
    # Namespace test один на всех: два прогона сразу мешали бы друг другу.
    concurrency:
      group: deploy-test
      cancel-in-progress: false
    env:
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build images
        timeout-minutes: 20
        run: docker compose build --push

      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0

      # Кладём kubeconfig в .kube/ внутри репозитория: education/autograding
      # запускает тесты с урезанным окружением, и путь передаётся явно.
      - name: Configure kubectl
        env:
          KUBECONFIG_RAW: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p .kube
          echo "$KUBECONFIG_RAW" > .kube/config
          chmod 600 .kube/config
          echo "KUBECONFIG=$PWD/.kube/config" >> "$GITHUB_ENV"

      - name: Deploy to k8s
        timeout-minutes: 10
        run: |
          helm upgrade --install postgres k8s/postgres -n test --wait --timeout 3m
          for service in library rating reservation gateway; do
            helm upgrade --install "$service" k8s/service -n test \
              -f "k8s/values/$service.yaml" \
              --set image.tag="$IMAGE_TAG" \
              --wait --timeout 5m
          done

      - name: Wait before services are ready
        run: kubectl rollout status deployment gateway -n test --timeout 3m

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install newman
        run: npm install -g newman

      - name: Autograding
        uses: education/autograding@v1
        continue-on-error: true

      - name: Cleanup k8s
        if: always() && env.KUBECONFIG != ''
        run: |
          helm list -n test -q | xargs -r -n1 helm uninstall -n test --wait --timeout 3m
